<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Каталог деталей{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='4' fill='%233566f0'/%3E%3Cpath d='M8 8h8M8 12h8M8 16h5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Каталог деталей PCB_EU</a>
  <nav>
    <a href="/" class="{{ 'on' if page == 'search' }}">Поиск</a>
    <a href="/bom" class="{{ 'on' if page == 'bom' }}">BOM</a>
    <a href="/crawl" class="{{ 'on' if page == 'crawl' }}">Сбор{% if running() %}<span class="run-dot" title="идёт сбор"></span>{% endif %}</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
